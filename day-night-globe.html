<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdhanLive — Day/Night Globe Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: Inter, sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; }
  #info {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    letter-spacing: 0.05em;
    text-align: center;
    pointer-events: none;
  }
  #sun-info {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    font-family: monospace;
    line-height: 1.8;
  }
  #time-display {
    position: fixed;
    bottom: 20px;
    right: 20px;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    font-family: monospace;
    text-align: right;
    line-height: 1.8;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="info">AdhanLive — Day/Night Terminator Test</div>
<div id="sun-info">
  Sun Lat: <span id="sun-lat">--</span>°<br>
  Sun Lon: <span id="sun-lon">--</span>°<br>
  Terminator: <span id="term-width">18°</span> twilight zone
</div>
<div id="time-display">
  UTC: <span id="utc-time">--</span><br>
  <span id="date-display">--</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene Setup ───────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 2.5;

// Stars
const starGeometry = new THREE.BufferGeometry();
const starCount = 3000;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) starPositions[i] = (Math.random() - 0.5) * 200;
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.6 })));

// ─── Sun Position ──────────────────────────────────────────────────────────
function getSunPosition(date) {
  const JD = date.getTime() / 86400000 + 2440587.5;
  const n = JD - 2451545.0;
  const L = (280.460 + 0.9856474 * n) % 360;
  const g = ((357.528 + 0.9856003 * n) % 360) * Math.PI / 180;
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * Math.PI / 180;
  const epsilon = (23.439 - 0.0000004 * n) * Math.PI / 180;
  const dec = Math.asin(Math.sin(epsilon) * Math.sin(lambda));
  const ra = Math.atan2(Math.cos(epsilon) * Math.sin(lambda), Math.cos(lambda));
  const GMST = (6.697375 + 0.0657098242 * n + (date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600) * 1.00273791) % 24;
  const sunLon = ((ra * 180 / Math.PI) - GMST * 15 + 360) % 360;
  const sunLonAdj = sunLon > 180 ? sunLon - 360 : sunLon;
  return { lat: dec * 180 / Math.PI, lon: sunLonAdj };
}

// ─── The key: shader uses UV coordinates to determine day/night ────────────
// This approach calculates the angle directly from UV (lat/lon on texture)
// rather than relying on vertex normals, so it works correctly regardless
// of globe rotation.

const vertexShader = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const fragmentShader = `
  uniform sampler2D earthTexture;
  uniform float sunLat;   // degrees
  uniform float sunLon;   // degrees
  uniform float twilightAngle; // degrees

  varying vec2 vUv;

  #define PI 3.14159265358979

  void main() {
    vec4 texColor = texture2D(earthTexture, vUv);

    // Convert UV to lat/lon
    // UV: u=0..1 maps to lon -180..180, v=0..1 maps to lat 90..-90
    float lon = (vUv.x - 0.5) * 360.0;  // -180 to 180
    float lat = (0.5 - vUv.y) * 180.0;  // 90 to -90

    // Convert to radians
    float latRad = lat * PI / 180.0;
    float lonRad = lon * PI / 180.0;
    float sunLatRad = sunLat * PI / 180.0;
    float sunLonRad = sunLon * PI / 180.0;

    // Spherical dot product between surface point and sub-solar point
    // This gives cos(angle) between them
    float cosAngle = sin(latRad) * sin(sunLatRad) +
                     cos(latRad) * cos(sunLatRad) * cos(lonRad - sunLonRad);

    // Twilight zone width in cos space
    float twilightCos = cos((90.0 - twilightAngle) * PI / 180.0);

    // smoothstep across twilight zone
    float dayFactor = smoothstep(-twilightCos, twilightCos, cosAngle);

    float nightBrightness = 0.15;
    float brightness = mix(nightBrightness, 1.0, dayFactor);

    gl_FragColor = vec4(texColor.rgb * brightness, texColor.a);
  }
`;

const textureLoader = new THREE.TextureLoader();
const earthTexture = textureLoader.load(
  'https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/textures/planets/earth_atmos_2048.jpg'
);

const globeGeometry = new THREE.SphereGeometry(1, 64, 64);
const globeMaterial = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms: {
    earthTexture: { value: earthTexture },
    sunLat: { value: 0.0 },
    sunLon: { value: 0.0 },
    twilightAngle: { value: 18.0 }
  }
});

const globe = new THREE.Mesh(globeGeometry, globeMaterial);
scene.add(globe);

// Atmosphere
const atmosphereMaterial = new THREE.ShaderMaterial({
  vertexShader: `varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec3 vNormal; void main() { float i = pow(0.7 - dot(vNormal, vec3(0,0,1)), 3.0); gl_FragColor = vec4(0.15, 0.5, 0.8, 1.0) * i; }`,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.02, 64, 64), atmosphereMaterial));

// ─── Drag: rotate globe mesh (texture stays with globe, shader uses UV) ────
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };
let autoRotate = true;

renderer.domElement.addEventListener('mousedown', e => {
  isDragging = true;
  autoRotate = false;
  previousMousePosition = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - previousMousePosition.x;
  const dy = e.clientY - previousMousePosition.y;
  globe.rotation.y += dx * 0.005;
  globe.rotation.x += dy * 0.005;
  previousMousePosition = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('mouseup', () => { isDragging = false; });
renderer.domElement.addEventListener('mouseleave', () => { isDragging = false; });

renderer.domElement.addEventListener('touchstart', e => {
  isDragging = true; autoRotate = false;
  previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  e.preventDefault();
}, { passive: false });
renderer.domElement.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const dx = e.touches[0].clientX - previousMousePosition.x;
  const dy = e.touches[0].clientY - previousMousePosition.y;
  globe.rotation.y += dx * 0.005;
  globe.rotation.x += dy * 0.005;
  previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  e.preventDefault();
}, { passive: false });
renderer.domElement.addEventListener('touchend', () => { isDragging = false; });

// ─── The sun lon offset accounts for Three.js SphereGeometry UV mapping ───
// SphereGeometry starts texture at lon=180 (back of sphere when facing +Z)
// We need to offset sun longitude by 90 degrees to align with texture
const LON_OFFSET = 90;

// ─── UI Update ─────────────────────────────────────────────────────────────
function updateUI(sunPos, now) {
  document.getElementById('sun-lat').textContent = sunPos.lat.toFixed(2);
  document.getElementById('sun-lon').textContent = sunPos.lon.toFixed(2);
  const h = String(now.getUTCHours()).padStart(2, '0');
  const m = String(now.getUTCMinutes()).padStart(2, '0');
  const s = String(now.getUTCSeconds()).padStart(2, '0');
  document.getElementById('utc-time').textContent = `${h}:${m}:${s}`;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('date-display').textContent =
    `${now.getUTCDate()} ${months[now.getUTCMonth()]} ${now.getUTCFullYear()}`;
}

// ─── Animation ─────────────────────────────────────────────────────────────
let lastUIUpdate = 0;

function animate() {
  requestAnimationFrame(animate);
  const now = new Date();
  const sunPos = getSunPosition(now);

  // The UV-based shader takes raw lat/lon — no transformation needed
  // Just account for the texture longitudinal offset
  globeMaterial.uniforms.sunLat.value = sunPos.lat;
  globeMaterial.uniforms.sunLon.value = sunPos.lon + LON_OFFSET;

  if (autoRotate) globe.rotation.y += 0.0005;

  if (now.getTime() - lastUIUpdate > 1000) {
    updateUI(sunPos, now);
    lastUIUpdate = now.getTime();
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
