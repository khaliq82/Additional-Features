<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdhanLive — Day/Night Globe Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: Inter, sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; }
  #info {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    letter-spacing: 0.05em;
    text-align: center;
    pointer-events: none;
  }
  #sun-info {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    font-family: monospace;
    line-height: 1.8;
  }
  #time-display {
    position: fixed;
    bottom: 20px;
    right: 20px;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    font-family: monospace;
    text-align: right;
    line-height: 1.8;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="info">AdhanLive — Day/Night Terminator Test</div>
<div id="sun-info">
  Sun Lat: <span id="sun-lat">--</span>°<br>
  Sun Lon: <span id="sun-lon">--</span>°<br>
  Terminator: <span id="term-width">18°</span> twilight zone
</div>
<div id="time-display">
  UTC: <span id="utc-time">--</span><br>
  <span id="date-display">--</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene Setup ───────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

// Camera orbit state — we move the camera, not the globe
let camTheta = 0;      // horizontal angle (longitude view)
let camPhi = Math.PI / 2; // vertical angle (latitude view), starts at equator
const camRadius = 2.5;

function updateCamera() {
  camera.position.x = camRadius * Math.sin(camPhi) * Math.sin(camTheta);
  camera.position.y = camRadius * Math.cos(camPhi);
  camera.position.z = camRadius * Math.sin(camPhi) * Math.cos(camTheta);
  camera.lookAt(0, 0, 0);
}
updateCamera();

// Stars background
const starGeometry = new THREE.BufferGeometry();
const starCount = 3000;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) {
  starPositions[i] = (Math.random() - 0.5) * 200;
}
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.6 });
scene.add(new THREE.Points(starGeometry, starMaterial));

// ─── Sun Position Calculation ──────────────────────────────────────────────
function getSunPosition(date) {
  const JD = date.getTime() / 86400000 + 2440587.5;
  const n = JD - 2451545.0;
  const L = (280.460 + 0.9856474 * n) % 360;
  const g = ((357.528 + 0.9856003 * n) % 360) * Math.PI / 180;
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * Math.PI / 180;
  const epsilon = (23.439 - 0.0000004 * n) * Math.PI / 180;
  const sinDec = Math.sin(epsilon) * Math.sin(lambda);
  const dec = Math.asin(sinDec);
  const ra = Math.atan2(Math.cos(epsilon) * Math.sin(lambda), Math.cos(lambda));
  const GMST = (6.697375 + 0.0657098242 * n + (date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600) * 1.00273791) % 24;
  const sunLon = ((ra * 180 / Math.PI) - GMST * 15 + 360) % 360;
  const sunLonAdj = sunLon > 180 ? sunLon - 360 : sunLon;
  return {
    lat: dec * 180 / Math.PI,
    lon: sunLonAdj
  };
}

// ─── Convert Sun Lat/Lon to 3D world direction ─────────────────────────────
// Globe is FIXED. Longitude 0 faces +Z, longitude 90E faces +X, north is +Y.
function sunLatLonToDirection(lat, lon) {
  const latRad = lat * Math.PI / 180;
  const lonRad = lon * Math.PI / 180;
  // Standard spherical to cartesian, matching Three.js SphereGeometry UV mapping
  return new THREE.Vector3(
    Math.cos(latRad) * Math.sin(lonRad),  // X = East
    Math.sin(latRad),                      // Y = North
    Math.cos(latRad) * Math.cos(lonRad)   // Z = towards lon 0
  ).normalize();
}

// ─── Globe Shader ──────────────────────────────────────────────────────────
const textureLoader = new THREE.TextureLoader();
const earthTexture = textureLoader.load(
  'https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/textures/planets/earth_atmos_2048.jpg'
);

const vertexShader = `
  varying vec3 vNormal;
  varying vec2 vUv;
  void main() {
    // Pass world-space normal (globe never rotates so world = local)
    vNormal = normalize(normalMatrix * normal);
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const fragmentShader = `
  uniform sampler2D earthTexture;
  uniform vec3 sunDirection;
  uniform float twilightAngle;

  varying vec3 vNormal;
  varying vec2 vUv;

  void main() {
    vec4 texColor = texture2D(earthTexture, vUv);
    float cosAngle = dot(normalize(vNormal), normalize(sunDirection));
    float twilightZone = sin(twilightAngle);
    float dayFactor = smoothstep(-twilightZone, twilightZone, cosAngle);
    float nightBrightness = 0.15;
    float brightness = mix(nightBrightness, 1.0, dayFactor);
    gl_FragColor = vec4(texColor.rgb * brightness, texColor.a);
  }
`;

const globeGeometry = new THREE.SphereGeometry(1, 64, 64);
const globeMaterial = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms: {
    earthTexture: { value: earthTexture },
    sunDirection: { value: new THREE.Vector3(1, 0, 0) },
    twilightAngle: { value: 18 * Math.PI / 180 }
  }
});

const globe = new THREE.Mesh(globeGeometry, globeMaterial);
// Globe NEVER rotates — it stays fixed in world space
scene.add(globe);

// Atmosphere glow
const atmosphereGeometry = new THREE.SphereGeometry(1.02, 64, 64);
const atmosphereMaterial = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    uniform vec3 cameraDir;
    void main() {
      float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
      gl_FragColor = vec4(0.15, 0.5, 0.8, 1.0) * intensity * 0.8;
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
scene.add(new THREE.Mesh(atmosphereGeometry, atmosphereMaterial));

// ─── Camera Drag (orbit around fixed globe) ────────────────────────────────
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };

renderer.domElement.addEventListener('mousedown', e => {
  isDragging = true;
  previousMousePosition = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - previousMousePosition.x;
  const dy = e.clientY - previousMousePosition.y;
  camTheta -= dx * 0.005;
  camPhi = Math.max(0.1, Math.min(Math.PI - 0.1, camPhi + dy * 0.005));
  updateCamera();
  previousMousePosition = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('mouseup', () => { isDragging = false; });
renderer.domElement.addEventListener('mouseleave', () => { isDragging = false; });

// Touch support
renderer.domElement.addEventListener('touchstart', e => {
  isDragging = true;
  previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  e.preventDefault();
}, { passive: false });

renderer.domElement.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const dx = e.touches[0].clientX - previousMousePosition.x;
  const dy = e.touches[0].clientY - previousMousePosition.y;
  camTheta -= dx * 0.005;
  camPhi = Math.max(0.1, Math.min(Math.PI - 0.1, camPhi + dy * 0.005));
  updateCamera();
  previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  e.preventDefault();
}, { passive: false });

renderer.domElement.addEventListener('touchend', () => { isDragging = false; });

// ─── Auto slow rotation (camera orbits, globe stays fixed) ─────────────────
let autoRotate = true;
renderer.domElement.addEventListener('mousedown', () => { autoRotate = false; });

// ─── Update UI ─────────────────────────────────────────────────────────────
function updateUI(sunPos, now) {
  document.getElementById('sun-lat').textContent = sunPos.lat.toFixed(2);
  document.getElementById('sun-lon').textContent = sunPos.lon.toFixed(2);
  const h = String(now.getUTCHours()).padStart(2, '0');
  const m = String(now.getUTCMinutes()).padStart(2, '0');
  const s = String(now.getUTCSeconds()).padStart(2, '0');
  document.getElementById('utc-time').textContent = `${h}:${m}:${s}`;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('date-display').textContent =
    `${now.getUTCDate()} ${months[now.getUTCMonth()]} ${now.getUTCFullYear()}`;
}

// ─── Set initial camera to face Makkah region (lon ~40E) ──────────────────
camTheta = -40 * Math.PI / 180;
camPhi = Math.PI / 2;
updateCamera();

// ─── Animation Loop ────────────────────────────────────────────────────────
let lastUIUpdate = 0;

function animate() {
  requestAnimationFrame(animate);

  const now = new Date();
  const sunPos = getSunPosition(now);

  // Sun direction in world space — globe never moves so this is always correct
  const sunDir = sunLatLonToDirection(sunPos.lat, sunPos.lon);
  globeMaterial.uniforms.sunDirection.value.copy(sunDir);

  // Auto slow camera orbit
  if (autoRotate) {
    camTheta -= 0.0005;
    updateCamera();
  }

  if (now.getTime() - lastUIUpdate > 1000) {
    updateUI(sunPos, now);
    lastUIUpdate = now.getTime();
  }

  renderer.render(scene, camera);
}

// ─── Resize ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
